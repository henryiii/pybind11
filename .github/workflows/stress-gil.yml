name: Stress GIL deadlock

on:
  push:
    branches:
      - stress/gil-deadlock

permissions:
  contents: read

env:
  PYTHONDEVMODE: 1
  PIP_ONLY_BINARY: numpy

jobs:
  repro:
    name: repro ${{ matrix.os }} ${{ matrix.python }} load=${{ matrix.load }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.14', '3.14t', '3.15t']
        load: [0, 4]
    env:
      PYTHONDEVMODE: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python .github/stress/repro.py --load ${{ matrix.load }} --seconds 60

  stress:
    name: real jobs=${{ matrix.jobs }} load=${{ matrix.load }} timeout=${{ matrix.timeout }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        jobs: [1, 6]
        load: [4]
        timeout: [10, 0]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14t'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Prepare env
        run: uv pip install --python=python --system -r tests/requirements.txt setuptools

      - name: Configure
        run: >
          cmake -S. -Bbuild
          -DPYBIND11_WERROR=ON
          -DDOWNLOAD_CATCH=ON
          -DDOWNLOAD_EIGEN=ON
          -DPYBIND11_EIGEN_REPO=https://github.com/eigen-mirror/eigen.git
          -DPYBIND11_TEST_OVERRIDE=test_gil_scoped
          -DPYTHON_EXECUTABLE=${{ steps.python.outputs.python-path }}
          -DCMAKE_CXX_STANDARD=23

      - name: Build
        run: cmake --build build --target pybind11_tests cross_module_gil_utils

      - name: Stress
        shell: pwsh
        run: |
          $pyd = Get-ChildItem build -Recurse -Filter "pybind11_tests*.pyd" | Select-Object -First 1
          python .github/stress/real.py --tests-dir $pyd.DirectoryName --source-tests "$PWD\tests" --minutes 12 --jobs ${{ matrix.jobs }} --load ${{ matrix.load }} --harness-timeout ${{ matrix.timeout }}
